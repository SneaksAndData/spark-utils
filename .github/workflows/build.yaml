name: Validate code

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  setup_test:
    name: Setup integration for Iceberg
    runs-on: ubuntu-latest
    if: ${{ github.ref != 'refs/heads/main' }}

    steps:
      - name: Build the Docker Compose stack
        run: docker compose up --quiet-pull -d

      - name: Get Compose Logs
        if: always()
        run: docker compose logs

  validate_code:
    name: Validate code in spark container
    runs-on: ubuntu-latest
    needs: setup_test
    if: ${{ github.ref != 'refs/heads/main' }}
    permissions:
      contents: read
      packages: read
      pull-requests: write

    container:
      image: ghcr.io/sneaksanddata/spark:v5.0.4
      credentials:
        username: USERNAME
        password: ${{ secrets.GHCR_TOKEN }}
      options: -u root -w /opt/spark --mount type=tmpfs,destination=/home/spark

    steps:
      - name: Build the Docker Compose stack
        run: docker compose up --quiet-pull -d

      - name: Get Compose Logs
        if: always()
        run: docker compose logs

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Poetry
        run: |
          set -e
          
          curl -sSL https://install.python-poetry.org | python3 -
      - name: Install Dependencies
        run: |
          set -e
          
          /github/home/.local/bin/poetry install --all-extras
      - name: Black
        shell: bash
        run: |
          set -e
          /github/home/.local/bin/poetry run black . --check --diff
      - name: Lint
        run: |
          set -e

          find ./spark_utils -type f -name "*.py" | xargs /github/home/.local/bin/poetry run pylint
      - name: Unit test
        shell: bash
        env:
          PYSPARK_SUBMIT_ARGS: "--packages org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.0,org.apache.iceberg:iceberg-aws-bundle:1.10.0,io.delta:delta-spark_2.12:3.2.1 pyspark-shell"
        run: |
          set -euxo pipefail

          /github/home/.local/bin/poetry run pytest --cov-config=.coveragerc --doctest-modules --junitxml=junit/test-results.xml --cov=. --cov-report=term-missing:skip-covered | tee pytest-coverage.txt
      - name: Publish Code Coverage
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./junit/test-results.xml
